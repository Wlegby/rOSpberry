[package]
name = "rospberry"
version = "0.1.0"
edition = "2024"

[dependencies]
linked_list_allocator = "0.10.6"
ttf-parser = { version = "0.25.1", default-features = false, features = ["no-std-float"]}

[features]
default = ["bsp_rpi3"]
bsp_rpi3 = []
bsp_rpi4 = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

